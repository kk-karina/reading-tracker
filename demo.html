<!doctype html>
<html lang="ru">

    <title>Образец данных</title>
  </head>
  <body style="font: 15px/1.5 system-ui; padding: 24px">
    <p id="out">Кладу образец в хранилище браузера…</p>

      import { plantDemo } from '/src/dev/demo.ts'
      const n = plantDemo()
